name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core tests with mock payments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_LLM_IN_HOT_PATH: "false"
      RAZORPAY_KEY_ID: rzp_test_placeholder
      RAZORPAY_KEY_SECRET: placeholder_secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run the existing core suite
        run: python -m pytest tests/ -q --tb=short
